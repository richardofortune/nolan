<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nolan Studio — design review</title>
<style>
  :root{
    --page:#F4F4F1; --sheet:#FFFFFF;
    --ink:#1A1D21; --ink-2:#4A5058; --ink-3:#6C737B;
    --rule:#DFDEDA; --rule-2:#C6C5C0; --indigo:#4F46E5;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--page);color:var(--ink);font:15px/1.6 var(--sans);
       display:grid;grid-template-rows:auto 1fr;overflow:hidden}
  .lbl{font:600 10.5px/1 var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}

  header{display:flex;align-items:center;gap:16px;padding:14px 22px;border-bottom:1px solid var(--rule-2);background:var(--sheet)}
  .mark{font-size:15px;font-weight:600;letter-spacing:-.02em}
  .mark span{color:var(--ink-3);font-weight:400}
  header .sp{margin-left:auto}
  .seg{display:flex;border:1px solid var(--rule-2);border-radius:7px;overflow:hidden}
  .seg button{font:600 12.5px var(--sans);padding:6px 12px;background:none;border:0;border-right:1px solid var(--rule-2);color:var(--ink-2);cursor:pointer}
  .seg button:last-child{border-right:0}
  .seg button[aria-pressed=true]{background:var(--ink);color:#fff}
  .seg button:hover:not([aria-pressed=true]){background:#EDECE8}
  .open{font:600 12.5px var(--sans);color:var(--indigo);text-decoration:none}
  .open:hover{text-decoration:underline}

  .body{display:grid;grid-template-columns:246px 1fr;min-height:0}
  nav{border-right:1px solid var(--rule);padding:18px 12px;overflow:auto}
  nav .lbl{display:block;padding:12px 10px 8px}
  nav button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:7px;
             padding:9px 10px;font:14px var(--sans);color:var(--ink-2);cursor:pointer;line-height:1.35}
  nav button small{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px}
  nav button:hover{background:#EDECE8;color:var(--ink)}
  nav button[aria-current]{background:var(--ink);color:#fff}
  nav button[aria-current] small{color:#B9BDC4}
  .hint{padding:14px 10px;font-size:11.5px;color:var(--ink-3);line-height:1.5;border-top:1px solid var(--rule);margin-top:12px}
  kbd{font:11px var(--mono);border:1px solid var(--rule-2);border-bottom-width:2px;border-radius:4px;padding:1px 4px;color:var(--ink-2)}

  .stage{min-height:0;display:grid;grid-template-rows:auto 1fr;overflow:hidden}
  .note{padding:14px 22px;border-bottom:1px solid var(--rule);background:var(--sheet)}
  .note h1{font-size:16px;font-weight:600;margin:0 0 3px;letter-spacing:-.01em}
  .note p{margin:0;font-size:13.5px;color:var(--ink-2);max-width:78ch}
  .frame{overflow:auto;padding:22px;display:flex;justify-content:center;align-items:flex-start}
  iframe{border:1px solid var(--rule-2);border-radius:7px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.05);flex:none}

  /* whole screens, live rather than captured, so they never go stale */
  .sheet-grid{display:none;grid-template-columns:repeat(auto-fill,minmax(348px,1fr));gap:26px;padding:22px;overflow:auto;align-content:start}
  body[data-view=sheet] .sheet-grid{display:grid}
  body[data-view=sheet] .frame,body[data-view=sheet] .note{display:none}
  .cell button{display:block;width:100%;padding:0;background:none;border:0;cursor:pointer;text-align:left}
  .shot{display:block;position:relative;border:1px solid var(--rule-2);border-radius:7px;overflow:hidden;background:#fff}
  .shot iframe{position:absolute;top:0;left:0;width:1200px;transform-origin:0 0;border:0;border-radius:0;box-shadow:none;pointer-events:none}
  .cell:hover .shot{border-color:var(--indigo)}
  .cap{display:block;padding:9px 2px 0;font-size:13px;font-weight:600}
  .cap small{display:block;font-weight:400;font-size:12px;color:var(--ink-3);margin-top:2px}

  /* flow: the loop in the order you move through it, whole screens */
  .flow{display:none;overflow:auto;padding:26px 24px 40px}
  body[data-view=flow] .flow{display:block}
  body[data-view=flow] .frame,body[data-view=flow] .note{display:none}
  .flow h2{font-size:15px;font-weight:600;margin:0 0 2px}
  .flow .lede{font-size:13.5px;color:var(--ink-2);margin:0 0 22px;max-width:76ch}
  .steps{display:flex;align-items:flex-start;gap:0}
  .step{flex:0 0 288px}
  .step .verb{font:600 10.5px var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);margin-bottom:7px}
  .step .cap{padding-top:8px}
  .arrow{flex:0 0 46px;display:flex;align-items:center;justify-content:center;padding-top:120px;color:var(--rule-2);font-size:19px}
  .fork{flex:0 0 288px;display:flex;flex-direction:column;gap:18px}
  .fork .tag{font:600 10.5px var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--indigo)}
  .ends{margin-top:26px;padding-top:16px;border-top:1px solid var(--rule);font-size:13.5px;color:var(--ink-2);max-width:74ch}
</style>

<header>
  <span class="mark">nolan <span>studio</span></span>
  <span class="lbl">design review</span>
  <span class="sp"></span>
  <div class="seg" id="widths">
    <button data-w="1200" aria-pressed="true">Desktop</button>
    <button data-w="834">Tablet</button>
    <button data-w="390">Phone</button>
    <button data-w="flow">Flow</button>
    <button data-w="sheet">Every screen</button>
  </div>
  <a class="open" id="open" href="#" target="_blank" rel="noopener">Open on its own</a>
</header>

<div class="body">
  <nav id="nav"></nav>
  <div class="stage">
    <div class="note"><h1 id="title"></h1><p id="desc"></p></div>
    <div class="frame"><iframe id="view" title="Preview"></iframe></div>
    <div class="sheet-grid" id="grid"></div>
    <div class="flow" id="flow"></div>
  </div>
</div>

<script>
const ITEMS = [
  { group:"Foundations", file:"foundations/color.html", name:"Colour",
    sub:"The sheet, and the one dark mark on it",
    desc:"Studio is read in for an hour at a time, so it is a working sheet rather than a console. The only dark mass on a screen is nolan's caption bar, which is a real part of the film. Includes the wrong version for comparison." },
  { group:"Foundations", file:"foundations/type.html", name:"Type",
    sub:"One face, two jobs, and the gutter",
    desc:"Sans carries anything a person said. Mono carries anything a machine owns, and never a sentence. The timecode gutter runs down every screen, because everything here was said at a time." },

  { group:"The loop", file:"screens/what-went-out.html", name:"What went out",
    sub:"The home",
    desc:"The stream is read, not watched. Each walkthrough shows the lines it said, so you scan what your product told people this morning. Nothing is flagged for you: the floor already caught every mechanical fault, so anything still wrong is a judgment call." },
  { group:"The loop", file:"screens/a-moment.html", name:"A moment",
    sub:"Stopped on the bit that is wrong",
    desc:"The transcript leads and the film sits beside it, because reading is faster than watching. Pauses appear in the gutter and as breaks in the tempo strip, which is the only place tempo can be judged without playing it." },
  { group:"The loop", file:"screens/say-whats-wrong.html", name:"Say what is wrong",
    sub:"Plain words in, a sentence back",
    desc:"You type what you would say to a colleague. Studio answers with a sentence, not a form, and the only two controls are phrases inside that sentence. Scope is set by editing words." },
  { group:"The loop", file:"screens/reach-a-audit.html", name:"Reach, direction A",
    sub:"Trust through volume",
    desc:"Every line the change moves, grouped, old struck through, including the six it spoils. Fast to audit. Compare against direction B and pick one." },
  { group:"The loop", file:"screens/reach-b-watch.html", name:"Reach, direction B",
    sub:"Trust through depth",
    desc:"Refuses the list. Three walkthroughs to watch properly, count as a footnote, on the argument that skimming 43 diffs tells you less than watching three. One of the three is a case the change spoils." },
];

const nav = document.getElementById("nav");
const view = document.getElementById("view");
const grid = document.getElementById("grid");
let current = 0, width = 1200;

// left list, grouped
let lastGroup = null;
ITEMS.forEach((it, i) => {
  if (it.group !== lastGroup) {
    const l = document.createElement("span");
    l.className = "lbl"; l.textContent = it.group;
    nav.appendChild(l); lastGroup = it.group;
  }
  const b = document.createElement("button");
  b.innerHTML = it.name + "<small>" + it.sub + "</small>";
  b.onclick = () => select(i);
  nav.appendChild(b);
});
const hint = document.createElement("p");
hint.className = "hint";
hint.innerHTML = "<kbd>j</kbd> and <kbd>k</kbd> move between screens. <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> set the width, <kbd>0</kbd> shows every screen whole, <kbd>f</kbd> shows the flow.<br><br>The address bar tracks the screen you are on, so you can send someone a link to one of them.";
nav.appendChild(hint);

// A thumbnail of a WHOLE screen. The height comes from the page itself once it
// loads, so nothing is cropped and nothing has to be kept in sync by hand.
function thumb(it, cellW, onClick) {
  const scale = cellW / 1200;
  const cell = document.createElement("div");
  cell.className = "cell";
  cell.innerHTML = '<button><span class="shot"><iframe src="' + it.file + '" scrolling="no" tabindex="-1"></iframe></span>' +
                   '<span class="cap">' + it.name + '<small>' + it.sub + '</small></span></button>';
  const box = cell.querySelector(".shot"), f = cell.querySelector("iframe");
  f.style.transform = "scale(" + scale + ")";
  box.style.height = Math.round(900 * scale) + "px";   // until it reports its real height
  f.addEventListener("load", () => {
    try {
      const h = f.contentDocument.documentElement.scrollHeight;
      f.style.height = h + "px";
      box.style.height = Math.round(h * scale) + "px";
    } catch { /* a cross origin page would land here. ours never do. */ }
  });
  cell.querySelector("button").onclick = onClick;
  return cell;
}

// every screen, whole
ITEMS.forEach((it, i) => grid.appendChild(thumb(it, 346, () => { setWidth(1200); select(i); })));

// the loop, in the order you move through it
const flow = document.getElementById("flow");
const idx = (name) => ITEMS.findIndex((it) => it.name === name);
const STEPS = [
  { verb:"Notice", i: idx("What went out") },
  { verb:"Stop on it", i: idx("A moment") },
  { verb:"Say it", i: idx("Say what is wrong") },
];
flow.innerHTML = '<h2>The loop</h2><p class="lede">Four screens, in the order someone moves ' +
  'through them. Reach forks, because there are two takes on it and only one should survive.</p>';
const steps = document.createElement("div");
steps.className = "steps";
STEPS.forEach((st, n) => {
  const wrap = document.createElement("div");
  wrap.className = "step";
  const v = document.createElement("div"); v.className = "verb"; v.textContent = st.verb;
  wrap.appendChild(v);
  wrap.appendChild(thumb(ITEMS[st.i], 286, () => { setWidth(1200); select(st.i); }));
  steps.appendChild(wrap);
  const a = document.createElement("div"); a.className = "arrow"; a.textContent = "\u2192";
  steps.appendChild(a);
});
const fork = document.createElement("div");
fork.className = "fork";
const fv = document.createElement("div"); fv.className = "verb"; fv.textContent = "See the reach, then let it hold";
fork.appendChild(fv);
[idx("Reach, direction A"), idx("Reach, direction B")].forEach((i) => {
  const t = document.createElement("div"); t.className = "tag";
  t.textContent = ITEMS[i].name.replace("Reach, ", "");
  fork.appendChild(t);
  fork.appendChild(thumb(ITEMS[i], 286, () => { setWidth(1200); select(i); }));
});
steps.appendChild(fork);
flow.appendChild(steps);
const ends = document.createElement("p");
ends.className = "ends";
ends.textContent = "Holding a decision is the end of the loop and the start of the next one, " +
  "because the change shapes everything the pipeline writes from then on, and the next thing " +
  "worth noticing turns up in what went out.";
flow.appendChild(ends);

const slug = (it) => it.name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

function select(i) {
  current = i;
  const it = ITEMS[i];
  history.replaceState(null, "", "#" + slug(it));   // a review link can point at one screen
  [...nav.querySelectorAll("button")].forEach((b, n) => b.toggleAttribute("aria-current", n === i));
  document.getElementById("title").textContent = it.name;
  document.getElementById("desc").textContent = it.desc;
  document.getElementById("open").href = it.file;
  if (view.getAttribute("src") !== it.file) view.src = it.file;
}

function setWidth(w) {
  width = w;
  [...document.querySelectorAll("#widths button")].forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.w === String(w))));
  if (w === "sheet" || w === "flow") { document.body.dataset.view = w; return; }
  document.body.dataset.view = "one";
  view.style.width = w + "px";
  // tall enough that the screens do not scroll inside their own frame
  view.style.height = (w === 390 ? 1500 : w === 834 ? 1200 : 1000) + "px";
}

document.querySelectorAll("#widths button").forEach(b =>
  b.onclick = () => setWidth(["sheet", "flow"].includes(b.dataset.w) ? b.dataset.w : Number(b.dataset.w)));

addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "j") select(Math.min(current + 1, ITEMS.length - 1));
  if (e.key === "k") select(Math.max(current - 1, 0));
  if (e.key === "1") setWidth(1200);
  if (e.key === "2") setWidth(834);
  if (e.key === "3") setWidth(390);
  if (e.key === "0") setWidth("sheet");
  if (e.key === "f") setWidth("flow");
});

// deep link: #a-moment opens that screen, #all opens the contact sheet
const asked = decodeURIComponent(location.hash.slice(1));
const found = ITEMS.findIndex((it) => slug(it) === asked);
setWidth(asked === "all" ? "sheet" : asked === "flow" ? "flow" : 1200);
select(found === -1 ? 0 : found);
</script>
</html>
