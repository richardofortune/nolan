<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1274" viewBox="20 -124 1760 1274"><rect x="20" y="-124" width="1760" height="1274" fill="#ffffff"/><text x="60" y="-54.56" text-anchor="start" fill="#1e1e1e" font-family="Segoe Print, Bradley Hand, Chalkboard SE, Comic Sans MS, sans-serif" font-size="32"><tspan x="60" dy="0">nolan core and nolan studio</tspan></text><text x="60" y="-25.28" text-anchor="start" fill="#868e96" font-family="Segoe Print, Bradley Hand, Chalkboard SE, Comic Sans MS, sans-serif" font-size="16"><tspan x="60" dy="0">One loop. Core films it, Studio makes the next one better.</tspan></text><rect x="60" y="60" width="1680" height="410" rx="12" fill="transparent" stroke="#adb5bd" stroke-width="1" stroke-dasharray="10 7"/><text x="90" y="98.4" text-anchor="start" fill="#5f3dc4" font-family="Segoe Print, Bradley Hand, Chalkboard SE, Comic Sans MS, sans-serif" font-size="20"><tspan x="90" dy="0">NOLAN STUDIO</tspan></text><text x="90" y="120.88" text-anchor="start" fill="#868e96" font-family="Segoe Print, Bradley Hand, Chalkboard SE, Comic Sans MS, sans-serif" font-size="14"><tspan x="90" dy="0">The paid layer. A private repo.</tspan></text><rect x="60" y="540" width="1680" height="300" rx="12" fill="transparent" stroke="#adb5bd" stroke-width="1" stroke-dasharray="10 7"/><text x="90" y="576.4" text-anchor="start" fill="#e67700" font-family="Segoe Print, Bradley Hand, Chalkboard SE, Comic Sans MS, sans-serif" font-size="20"><tspan x="90" dy="0">THE CUSTOMER'S PIPELINE</tspan></text><text x="90" y="598.88" text-anchor="start" fill="#868e96" font-family="Segoe Print, Bradley Hand, Chalkboard SE, Comic Sans MS, sans-serif" font-size="14"><tspan x="90" dy="0">Runs on their events, in their environment.</tspan></text><rect x="60" y="880" width="1680" height="230" rx="12" fill="transparent" stroke="#adb5bd" stroke-width="1" stroke-dasharray="10 7"/><text x="90" y="916.4" text-anchor="start" fill="#2f9e44" font-family="Segoe Print, Bradley Hand, Chalkboard SE, Comic Sans MS, sans-serif" font-size="20"><tspan x="90" dy="0">NOLAN CORE</tspan></text><text x="90" y="938.88" text-anchor="start" fill="#868e96" font-family="Segoe Print, Bradley Hand, Chalkboard SE, Comic Sans MS, sans-serif" font-size="14"><tspan x="90" dy="0">Open source, MIT. The engine.</tspan></text><rect x="1420" y="190" width="210" height="100" rx="12" fill="#e5dbff" stroke="#5f3dc4" stroke-width="2"/><text x="1525" y="234.72" text-anchor="middle" fill="#1e1e1e" font-family="Segoe Print, Bradley Hand, Chalkboard SE, Comic Sans MS, sans-serif" font-size="16"><tspan x="1525" dy="0">Notice</tspan><tspan x="1525" dy="20">a real one that went out</tspan></text><rect x="1160" y="190" width="210" height="100" rx="12" fill="#e5dbff" stroke="#5f3dc4" stroke-width="2"/><text x="1265" y="234.72" text-anchor="middle" fill="#1e1e1e" font-family="Segoe Print, Bradley Hand, Chalkboard SE, Comic Sans MS, sans-serif" font-size="16"><tspan x="1265" dy="0">Say what's wrong</tspan><tspan x="1265" dy="20">in your own words</tspan></text><rect x="900" y="190" width="210" height="100" rx="12" fill="#e5dbff" stroke="#5f3dc4" stroke-width="4"/><text x="1005" y="225.675" text-anchor="middle" fill="#1e1e1e" font-family="Segoe Print, Bradley Hand, Chalkboard SE, Comic Sans MS, sans-serif" font-size="15"><tspan x="1005" dy="0">Reach</tspan><tspan x="1005" dy="18.75">it would have changed</tspan><tspan x="1005" dy="18.75">43 of the last 200</tspan></text><rect x="640" y="190" width="210" height="100" rx="12" fill="#e5dbff" stroke="#5f3dc4" stroke-width="2"/><text x="745" y="234.72" text-anchor="middle" fill="#1e1e1e" font-family="Segoe Print, Bradley Hand, Chalkboard SE, Comic Sans MS, sans-serif" font-size="16"><tspan x="745" dy="0">Hold</tspan><tspan x="745" dy="20">it applies from now on</tspan></text><rect x="380" y="190" width="210" height="100" rx="12" fill="#e5dbff" stroke="#5f3dc4" stroke-width="2"/><text x="485" y="234.72" text-anchor="middle" fill="#1e1e1e" font-family="Segoe Print, Bradley Hand, Chalkboard SE, Comic Sans MS, sans-serif" font-size="16"><tspan x="485" dy="0">The kit</tspan><tspan x="485" dy="20">what a team owns</tspan></text><rect x="350" y="340" width="210" height="80" rx="12" fill="#e5dbff" stroke="#5f3dc4" stroke-width="2"/><text x="455" y="374.72" text-anchor="middle" fill="#1e1e1e" font-family="Segoe Print, Bradley Hand, Chalkboard SE, Comic Sans MS, sans-serif" font-size="16"><tspan x="455" dy="0">Steer</tspan><tspan x="455" dy="20">how to write it</tspan></text><rect x="630" y="340" width="210" height="80" rx="12" fill="#e5dbff" stroke="#5f3dc4" stroke-width="2"/><text x="735" y="374.72" text-anchor="middle" fill="#1e1e1e" font-family="Segoe Print, Bradley Hand, Chalkboard SE, Comic Sans MS, sans-serif" font-size="16"><tspan x="735" dy="0">Gate</tspan><tspan x="735" dy="20">what can't ship</tspan></text><polyline points="1420,240 1370,240" fill="none" stroke="#5f3dc4" stroke-width="2" stroke-linejoin="round"/><polygon points="1370,240 1379.0044710235268,235.6503446588877 1379.0044710235268,244.3496553411123" fill="#5f3dc4"/><polyline points="1160,240 1110,240" fill="none" stroke="#5f3dc4" stroke-width="2" stroke-linejoin="round"/><polygon points="1110,240 1119.0044710235268,235.6503446588877 1119.0044710235268,244.3496553411123" fill="#5f3dc4"/><polyline points="900,240 850,240" fill="none" stroke="#5f3dc4" stroke-width="2" stroke-linejoin="round"/><polygon points="850,240 859.0044710235268,235.6503446588877 859.0044710235268,244.3496553411123" fill="#5f3dc4"/><polyline points="640,240 590,240" fill="none" stroke="#5f3dc4" stroke-width="2" stroke-linejoin="round"/><polygon points="590,240 599.0044710235268,235.6503446588877 599.0044710235268,244.3496553411123" fill="#5f3dc4"/><polyline points="455,290 455,340" fill="none" stroke="#5f3dc4" stroke-width="2" stroke-linejoin="round"/><polygon points="455,340 450.6503446588877,330.9955289764732 459.3496553411123,330.9955289764732" fill="#5f3dc4"/><polyline points="570,290 720,340" fill="none" stroke="#5f3dc4" stroke-width="2" stroke-linejoin="round"/><polygon points="720,340 710.0821269407372,341.2789816184562 712.8330905236635,333.0260908696773" fill="#5f3dc4"/><text x="890" y="311.96" text-anchor="start" fill="#5f3dc4" font-family="Segoe Print, Bradley Hand, Chalkboard SE, Comic Sans MS, sans-serif" font-size="13"><tspan x="890" dy="0">Reach is the whole product. Everything else in this</tspan><tspan x="890" dy="16.25">space promises an outcome. This one shows it first.</tspan></text><rect x="150" y="650" width="200" height="100" rx="12" fill="#fff3bf" stroke="#e67700" stroke-width="2"/><text x="250" y="694.72" text-anchor="middle" fill="#1e1e1e" font-family="Segoe Print, Bradley Hand, Chalkboard SE, Comic Sans MS, sans-serif" font-size="16"><tspan x="250" dy="0">Something happens</tspan><tspan x="250" dy="20">a question, a release</tspan></text><rect x="430" y="650" width="240" height="100" rx="12" fill="#fff3bf" stroke="#e67700" stroke-width="2"/><text x="550" y="694.72" text-anchor="middle" fill="#1e1e1e" font-family="Segoe Print, Bradley Hand, Chalkboard SE, Comic Sans MS, sans-serif" font-size="16"><tspan x="550" dy="0">Their AI writes it</tspan><tspan x="550" dy="20">loading the steer</tspan></text><rect x="750" y="650" width="200" height="100" rx="12" fill="#fff3bf" stroke="#e67700" stroke-width="2"/><text x="850" y="694.72" text-anchor="middle" fill="#1e1e1e" font-family="Segoe Print, Bradley Hand, Chalkboard SE, Comic Sans MS, sans-serif" font-size="16"><tspan x="850" dy="0">The gate</tspan><tspan x="850" dy="20">passes, or says why not</tspan></text><rect x="1030" y="650" width="200" height="100" rx="12" fill="#fff3bf" stroke="#e67700" stroke-width="2"/><text x="1130" y="694.72" text-anchor="middle" fill="#1e1e1e" font-family="Segoe Print, Bradley Hand, Chalkboard SE, Comic Sans MS, sans-serif" font-size="16"><tspan x="1130" dy="0">nolan films it</tspan><tspan x="1130" dy="20">driving the real app</tspan></text><rect x="1310" y="650" width="200" height="100" rx="12" fill="#fff3bf" stroke="#e67700" stroke-width="2"/><text x="1410" y="695.05" text-anchor="middle" fill="#1e1e1e" font-family="Segoe Print, Bradley Hand, Chalkboard SE, Comic Sans MS, sans-serif" font-size="15"><tspan x="1410" dy="0">It goes out</tspan><tspan x="1410" dy="18.75">with a customer's name on it</tspan></text><polyline points="350,700 430,700" fill="none" stroke="#e67700" stroke-width="2" stroke-linejoin="round"/><polygon points="430,700 420.9955289764732,704.3496553411123 420.9955289764732,695.6503446588877" fill="#e67700"/><polyline points="670,700 750,700" fill="none" stroke="#e67700" stroke-width="2" stroke-linejoin="round"/><polygon points="750,700 740.9955289764732,704.3496553411123 740.9955289764732,695.6503446588877" fill="#e67700"/><polyline points="950,700 1030,700" fill="none" stroke="#e67700" stroke-width="2" stroke-linejoin="round"/><polygon points="1030,700 1020.9955289764732,704.3496553411123 1020.9955289764732,695.6503446588877" fill="#e67700"/><polyline points="1230,700 1310,700" fill="none" stroke="#e67700" stroke-width="2" stroke-linejoin="round"/><polygon points="1310,700 1300.9955289764732,704.3496553411123 1300.9955289764732,695.6503446588877" fill="#e67700"/><polyline points="790,750 790,790 550,790 550,750" fill="none" stroke="#e67700" stroke-width="2" stroke-linejoin="round" stroke-dasharray="10 7"/><polygon points="550,750 554.3496553411123,759.0044710235268 545.6503446588877,759.0044710235268" fill="#e67700"/><text x="600" y="807.96" text-anchor="start" fill="#868e96" font-family="Segoe Print, Bradley Hand, Chalkboard SE, Comic Sans MS, sans-serif" font-size="13"><tspan x="600" dy="0">blocked, so it writes it again</tspan></text><polyline points="455,420 550,650" fill="none" stroke="#5f3dc4" stroke-width="2" stroke-linejoin="round"/><polygon points="550,650 542.5422331012735,643.338039861703 550.5826704019063,640.0169896723112" fill="#5f3dc4"/><polyline points="735,420 850,650" fill="none" stroke="#5f3dc4" stroke-width="2" stroke-linejoin="round"/><polygon points="850,650 842.0826281294245,643.8913812802713 849.8635281465623,640.0009312717024" fill="#5f3dc4"/><text x="150" y="491.96" text-anchor="start" fill="#5f3dc4" font-family="Segoe Print, Bradley Hand, Chalkboard SE, Comic Sans MS, sans-serif" font-size="13"><tspan x="150" dy="0">Two things, published once.</tspan><tspan x="150" dy="16.25">The pipeline loads them and runs.</tspan></text><polyline points="1410,650 1525,290" fill="none" stroke="#5f3dc4" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 7"/><polygon points="1525,290 1526.6840358353463,301.88124670669157 1516.7399131969019,298.7046519749663" fill="#5f3dc4"/><text x="900" y="492.88" text-anchor="start" fill="#5f3dc4" font-family="Segoe Print, Bradley Hand, Chalkboard SE, Comic Sans MS, sans-serif" font-size="14"><tspan x="900" dy="0">Studio reads what already went out.</tspan><tspan x="900" dy="17.5">It is never in the path, so it can never be the bottleneck.</tspan></text><rect x="750" y="980" width="200" height="90" rx="12" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><text x="850" y="1019.72" text-anchor="middle" fill="#1e1e1e" font-family="Segoe Print, Bradley Hand, Chalkboard SE, Comic Sans MS, sans-serif" font-size="16"><tspan x="850" dy="0">lint</tspan><tspan x="850" dy="20">the craft floor</tspan></text><rect x="1010" y="980" width="200" height="90" rx="12" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><text x="1110" y="1020.05" text-anchor="middle" fill="#1e1e1e" font-family="Segoe Print, Bradley Hand, Chalkboard SE, Comic Sans MS, sans-serif" font-size="15"><tspan x="1110" dy="0">verify</tspan><tspan x="1110" dy="18.75">do the targets still resolve</tspan></text><rect x="1270" y="980" width="200" height="90" rx="12" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><text x="1370" y="1019.72" text-anchor="middle" fill="#1e1e1e" font-family="Segoe Print, Bradley Hand, Chalkboard SE, Comic Sans MS, sans-serif" font-size="16"><tspan x="1370" dy="0">render</tspan><tspan x="1370" dy="20">screenplay in, film out</tspan></text><polyline points="850,750 850,980" fill="none" stroke="#2f9e44" stroke-width="2" stroke-linejoin="round"/><polygon points="850,980 845.6503446588877,970.9955289764732 854.3496553411123,970.9955289764732" fill="#2f9e44"/><polyline points="1090,750 1110,980" fill="none" stroke="#2f9e44" stroke-width="2" stroke-linejoin="round"/><polygon points="1110,980 1104.8866429341854,971.4061894646505 1113.5532493251417,970.6525715176109" fill="#2f9e44"/><polyline points="1180,750 1370,980" fill="none" stroke="#2f9e44" stroke-width="2" stroke-linejoin="round"/><polygon points="1370,980 1360.911801564342,975.8281120348092 1367.6186373658581,970.2876824596436" fill="#2f9e44"/><text x="150" y="997.88" text-anchor="start" fill="#2f9e44" font-family="Segoe Print, Bradley Hand, Chalkboard SE, Comic Sans MS, sans-serif" font-size="14"><tspan x="150" dy="0">Studio's gate calls core's own lint,</tspan><tspan x="150" dy="17.5">so the craft floor is the same in both.</tspan></text><text x="150" y="1046.96" text-anchor="start" fill="#868e96" font-family="Segoe Print, Bradley Hand, Chalkboard SE, Comic Sans MS, sans-serif" font-size="13"><tspan x="150" dy="0">Studio only uses core's public API.</tspan><tspan x="150" dy="16.25">When Studio needs something new, it goes</tspan><tspan x="150" dy="16.25">into core first, gets released, then flows here.</tspan></text></svg>
